<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0f1115">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Radio Henry</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0f1115 0%, #1a1d24 50%, #12141a 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8f9fa;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .player-card {
      background: #181a1f;
      border: 1px solid #2c303a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .cover {
      width: 160px;
      height: 160px;
      border-radius: 40%;
      overflow: hidden;
      flex-shrink: 0;
      border: 3px solid #2c303a;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      background: #1a1d24;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .player-wrapper {
      width: 100%;
    }

    #emisora-pro-widget {
      max-width: 100% !important;
    }

    .footer {
      margin-top: 18px;
      font-size: 0.75rem;
      color: #6c757d;
      text-align: center;
    }

    @media (min-width: 400px) {
      .container { max-width: 380px; }
      .cover { width: 130px; height: 130px; }
    }

    @media (max-width: 360px) {
      body { padding: 12px; }
      .cover { width: 100px; height: 100px; }
      .player-card { padding: 12px; gap: 10px; }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="player-card">
      <div class="cover">
        <img
          src="https://imgfz.com/i/umKbrAt.jpeg"
          alt="Radio Henry"
          width="130"
          height="130"
          loading="eager"
          decoding="async"
          fetchpriority="high">
      </div>

      <div class="player-wrapper">
        <div id="emisora-pro-widget"
             data-title="Radio Henry Web"
             data-emisora-pro="radio-henry-radio"
             data-script="https://wiget-emisora.pages.dev/radio_web_player.js"></div>
        <script src="https://wiget-emisora.pages.dev/wiget.js"></script>
      </div>
    </div>

    <div class="footer">
      Radio Henry Web· Señal en vivo
    </div>

  </div>

  <script>
    (function () {
      if ('mediaSession' in navigator) {
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'Radio Henry Web',
            artist: 'Señal en vivo',
            album: 'Radio Henry',
            artwork: [
              { src: 'https://imgfz.com/i/umKbrAt.jpeg', sizes: '512x512', type: 'image/jpeg' }
            ]
          });
        } catch (e) {}
      }
    })();
  </script>

</body>
</html>
