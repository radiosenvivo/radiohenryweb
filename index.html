<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0f1115">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Radio Henry</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0f1115 0%, #1a1d24 50%, #12141a 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8f9fa;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .player-card {
      background: #181a1f;
      border: 1px solid #2c303a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .cover {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 3px solid #2c303a;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      background: #1a1d24;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .player-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 8px;
    }

    /* Estilos para el now playing */
    .now-playing {
      width: 100%;
      text-align: center;
      padding: 10px 8px 4px;
      border-top: 1px solid #2c303a;
      margin-top: 4px;
    }

    .now-playing .label {
      font-size: 0.7rem;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .now-playing .song-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f8f9fa;
      line-height: 1.3;
      margin-bottom: 2px;
      word-break: break-word;
    }

    .now-playing .song-artist {
      font-size: 0.85rem;
      color: #adb5bd;
      line-height: 1.3;
      word-break: break-word;
    }

    .footer {
      margin-top: 18px;
      font-size: 0.75rem;
      color: #6c757d;
      text-align: center;
    }

    @media (min-width: 400px) {
      .container { max-width: 380px; }
      .cover { width: 130px; height: 130px; }
    }

    @media (max-width: 360px) {
      body { padding: 12px; }
      .cover { width: 100px; height: 100px; }
      .player-card { padding: 12px; gap: 10px; }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="player-card">
      <div class="cover">
        <img
          src="https://imgfz.com/i/umKbrAt.jpeg"
          alt="Radio Henry"
          width="130"
          height="130"
          loading="eager"
          decoding="async"
          fetchpriority="high">
      </div>

      <div class="player-wrapper">
        <audio id="radio-player" controls preload="none">
          <source src="https://stream.zeno.fm/73bvgeu2f78uv" type="audio/mpeg">
          Tu navegador no soporta el elemento de audio.
        </audio>

        <div class="now-playing">
          <div class="label">En reproducción</div>
          <div class="song-title" id="song-title">Cargando…</div>
          <div class="song-artist" id="song-artist">—</div>
        </div>
      </div>
    </div>

    <div class="footer">
      Radio Henry Web · Señal en vivo
    </div>

  </div>

  <script>
    (function () {
      const STREAM_URL = 'https://stream.zeno.fm/73bvgeu2f78uv';
      const METADATA_URL = 'https://api.zeno.fm/mounts/metadata/subscribe/73bvgeu2f78uv';

      const titleEl = document.getElementById('song-title');
      const artistEl = document.getElementById('song-artist');
      const audio = document.getElementById('radio-player');

      function updateMediaSession(title, artist) {
        if ('mediaSession' in navigator) {
          try {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: title || 'Radio Henry Web',
              artist: artist || 'Señal en vivo',
              album: 'Radio Henry',
              artwork: [
                { src: 'https://imgfz.com/i/umKbrAt.jpeg', sizes: '512x512', type: 'image/jpeg' }
              ]
            });
          } catch (e) {}
        }
      }

      // Inicializar Media Session
      updateMediaSession('Radio Henry Web', 'Señal en vivo');

      // Conexión a la API de metadatos de Zeno (SSE)
      function connectMetadata() {
        const es = new EventSource(METADATA_URL);

        es.onmessage = function (event) {
          try {
            const data = JSON.parse(event.data);
            const streamTitle = data.streamTitle || '';

            if (!streamTitle) {
              titleEl.textContent = 'Señal en vivo';
              artistEl.textContent = 'Radio Henry';
              updateMediaSession('Radio Henry Web', 'Señal en vivo');
              return;
            }

            // Formato habitual: "Artista - Título"
            let artist = '';
            let title = streamTitle;

            const sepIndex = streamTitle.indexOf(' - ');
            if (sepIndex > -1) {
              artist = streamTitle.substring(0, sepIndex).trim();
              title = streamTitle.substring(sepIndex + 3).trim();
            }

            titleEl.textContent = title || streamTitle;
            artistEl.textContent = artist || '—';

            updateMediaSession(title || streamTitle, artist || 'Radio Henry');
          } catch (err) {
            console.warn('Error parseando metadatos:', err);
          }
        };

        es.onerror = function () {
          // Reintentar automáticamente después de un momento
          es.close();
          setTimeout(connectMetadata, 5000);
        };
      }

      connectMetadata();
    })();
  </script>

</body>
</html>
